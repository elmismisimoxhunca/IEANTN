node:
  id: SMeansq.v1
  family: SMeansq
  version: v1
  kind: pipeline
  status: active

project:
  name: "SMeansq.v1"
  description: >-
    A pipeline node carrying a pointwise corridor for the zeta argument function S and two window
    moment bounds (mean square of the smoothed prime polynomial D, first moment of the remainder R)
    to an explicit short-interval mean-square bound: the integral of S(t)^2 over [T, T+H] is at
    most y^2 * H with y = (sqrt(d1) + sqrt(d1 + 4 pi Omega r1)) / (2 pi). The route is first-moment
    only: no pair-correlation input is consumed anywhere, which is what lets the bound reach
    moderate heights (the exhibited instantiation covers 1e6 <= T, T + H <= 3e12 - 1, H down to
    1e4). Every conclusion imports nothing: the decomposition, the majorant diagonalization and the
    zero-count input all arrive as hypotheses, so the node sits downstream of nodes supplying them
    rather than reproving them.
  authors: ["Sebastian Rodrigo"]
  license: "Apache-2.0"
  responsible_maintainers: ["Sebastian Rodrigo"]

repository:
  role: substantive-development

